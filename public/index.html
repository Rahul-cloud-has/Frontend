<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- ✅ FORCE LIGHT MODE - Fix Mobile Dark Background -->
    <meta name="color-scheme" content="light only">
    <meta name="theme-color" content="#f8fafc" />
    <meta name="supported-color-schemes" content="light">
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <meta name="description" content="EduSkillVision - Certificate Management System" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- ✅ Force Light Mode - Inline CSS (Loads First - Priority) -->
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
      }

      html {
        color-scheme: light only !important;
        background: #f8fafc !important;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }

      body {
        background: #f8fafc !important;
        color: #1e293b !important;
        color-scheme: light only !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 
                     'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 
                     'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        background: #f8fafc !important;
        min-height: 100vh;
      }

      /* ✅ Dark Mode Override - Force Light */
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background: #f8fafc !important;
          color: #1e293b !important;
          color-scheme: light only !important;
        }
      }

      /* ✅ Fix iOS Safari black flash */
      @supports (-webkit-touch-callout: none) {
        html, body, #root {
          background: #f8fafc !important;
        }
      }
    </style>

    <title>EduSkillVision</title>
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
